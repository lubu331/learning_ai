<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning AI Quiz App</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Learning AI Quiz App</h1>
    <p class="subtitle">Practice quizzes for kids and adults</p>

    <div class="card">
      <h2>Create Quiz</h2>

      <div class="form-grid">
        <div class="form-group">
          <label for="gradeLevel">Grade</label>
          <select id="gradeLevel">
            <option value="2" selected>2nd Grade</option>
          </select>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <select id="subject">
            <option value="math">Math</option>
            <option value="sociales">Sociales</option>
          </select>
        </div>

        <div class="form-group">
          <label for="questionType">Question Type</label>
          <select id="questionType">
            <option value="free_text">Free Text</option>
            <option value="multiple_choice">Multiple Choice</option>
          </select>
        </div>

        <div class="form-group">
          <label for="limit">Number of Questions</label>
          <input type="number" id="limit" value="3" min="1" max="10" />
        </div>
      </div>

      <button id="loadQuizBtn">Load Quiz</button>
      <p id="statusMessage" class="status"></p>
    </div>

    <div id="quizCard" class="card hidden">
      <div class="question-header">
        <h2>Question</h2>
        <span id="questionCounter"></span>
      </div>

      <div id="questionMeta" class="question-meta"></div>
      <div id="questionText" class="question-text"></div>

      <div id="freeTextArea" class="hidden">
        <input
          type="text"
          id="freeTextInput"
          placeholder="Type your answer here"
        />
        <button id="submitTextAnswerBtn">Submit Answer</button>
      </div>

      <div id="multipleChoiceArea" class="choices hidden"></div>

      <div id="feedbackBox" class="feedback hidden">
        <h3>Feedback</h3>
        <p id="feedbackText"></p>
        <p id="correctAnswerText"></p>
      </div>

      <button id="nextQuestionBtn" class="hidden">Next Question</button>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
