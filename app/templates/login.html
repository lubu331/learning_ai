{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded shadow-md mt-10">
    <h2 class="text-xl font-bold mb-4 text-center">Teacher Login</h2>
    <form hx-post="/auth/login" hx-target="#login-status" hx-swap="innerHTML">
        <input type="text" name="username" placeholder="Username" required class="w-full p-2 border rounded mb-3">
        <input type="password" name="password" placeholder="Password" required class="w-full p-2 border rounded mb-3">
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Login</button>
    </form>
    <div id="login-status"></div>
</div>
{% endblock %}
