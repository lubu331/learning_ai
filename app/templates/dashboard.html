{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white rounded-lg shadow-md p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Teacher Dashboard</h2>
    
    <!-- Upload Form -->
    <form hx-post="/quizzes/generate" 
          hx-target="#result" 
          hx-swap="innerHTML"
          enctype="multipart/form-data"
          class="space-y-4">
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Topic</label>
                <input type="text" name="topic" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-indigo-500 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Grade Level</label>
                <input type="text" name="grade" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-indigo-500 focus:ring-indigo-500">
            </div>
        </div>

        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:bg-gray-50 transition cursor-pointer">
            <label for="file-upload" class="cursor-pointer block">
                <span class="text-indigo-600 font-medium hover:underline">Click to upload</span> or drag and drop PDFs here.
            </label>
            <input id="file-upload" name="file" type="file" accept=".pdf" class="hidden">
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded hover:bg-indigo-700 font-medium transition">
            Generate Quiz from Document
        </button>
    </form>

    <!-- Results Area -->
    <div id="result" class="mt-8"></div>
</div>
{% endblock %}
